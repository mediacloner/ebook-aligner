<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Style Configuration - Bilingual Ebook Aligner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #6366f1;
        --primary-hover: #4f46e5;
        --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
        --card-bg: rgba(255, 255, 255, 0.95);
        --text-main: #1f2937;
        --text-sub: #6b7280;
        --border: #e5e7eb;
      }
      body {
        font-family: "Outfit", sans-serif;
        background: var(--bg-gradient);
        color: var(--text-main);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }

      .config-container {
        width: 100%;
        max-width: 550px;
        background: var(--card-bg);
        border-radius: 1.5rem;
        padding: 3rem;
        box-sizing: border-box;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        animation: scaleIn 0.3s ease-out;
      }

      @keyframes scaleIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      h1 {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        margin-top: 0;
        text-align: center;
        background: linear-gradient(to right, #4f46e5, #ec4899);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      p.subtitle {
        color: var(--text-sub);
        margin-bottom: 2.5rem;
        text-align: center;
      }

      .config-section {
        margin-bottom: 28px;
      }
      .config-section h3 {
        font-size: 14px;
        color: #6b7280;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
      }

      .option-group {
        margin-bottom: 20px;
      }
      .option-group label {
        display: block;
        font-size: 14px;
        color: #374151;
        margin-bottom: 8px;
        font-weight: 500;
      }
      .option-group select,
      .option-group input[type="number"] {
        width: 100%;
        padding: 12px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        font-size: 14px;
        background: #f9fafb;
        font-family: inherit;
        transition: all 0.2s;
        box-sizing: border-box;
      }
      .option-group select:focus,
      .option-group input:focus {
        outline: none;
        border-color: #4f46e5;
        background: white;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      }

      .color-picker-group {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .color-picker-group input[type="color"] {
        width: 48px;
        height: 44px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        cursor: pointer;
        background: white;
        padding: 2px;
      }
      .color-picker-group input[type="text"] {
        flex: 1;
        padding: 12px;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        font-size: 14px;
        font-family: monospace;
      }

      .preset-buttons {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .preset-btn {
        padding: 14px;
        border: 1px solid #e5e7eb;
        background: white;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
        font-family: inherit;
        font-weight: 500;
        transition: all 0.2s;
        color: #4b5563;
      }
      .preset-btn:hover {
        border-color: #4f46e5;
        background: #eef2ff;
        color: #4f46e5;
        transform: translateY(-1px);
      }
      .preset-btn.active {
        border-color: #4f46e5;
        background: #4f46e5;
        color: white;
        box-shadow: 0 4px 6px rgba(79, 70, 229, 0.2);
      }

      .actions {
        display: flex;
        gap: 12px;
        margin-top: 32px;
      }

      button.action-btn {
        flex: 1;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.2s;
      }

      .btn-secondary {
        background: #f3f4f6;
        color: #4b5563;
      }
      .btn-secondary:hover {
        background: #e5e7eb;
        color: #1f2937;
      }

      .btn-primary {
        background: linear-gradient(to right, #4f46e5, #ec4899);
        color: white;
        box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
      }
      .btn-primary:hover {
        filter: brightness(1.1);
        transform: translateY(-2px);
        box-shadow: 0 8px 15px -3px rgba(79, 70, 229, 0.3);
      }

      /* Preview Tags */
      .current-settings {
        margin-top: -10px;
        margin-bottom: 24px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
      }
      .setting-tag {
        display: inline-flex;
        align-items: center;
        background: #f3f4f6;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        color: #4b5563;
        border: 1px solid #e5e7eb;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <div class="config-container">
      <h1>Style Configuration</h1>
      <p class="subtitle">Customize your reading experience</p>

      <div class="current-settings" id="settingsPreview">
        <!-- Settings tags will appear here -->
      </div>

      <div class="config-body">
        <!-- Presets -->
        <div class="config-section">
          <h3>📋 Quick Presets</h3>
          <div class="preset-buttons">
            <button class="preset-btn" data-preset="default">Default</button>
            <button class="preset-btn" data-preset="side_by_side">
              Side-by-Side
            </button>
            <button class="preset-btn" data-preset="color_coded">
              Color Coded
            </button>
            <button class="preset-btn" data-preset="learner_mode">
              Learner Mode
            </button>
          </div>
        </div>

        <!-- Layout Mode -->
        <div class="config-section">
          <h3>📐 Layout</h3>
          <div class="option-group">
            <label for="layoutMode">Layout Mode</label>
            <select id="layoutMode">
              <option value="below">Spanish Below English</option>
              <option value="above">Spanish Above English</option>
              <option value="side">Side-by-Side</option>
              <option value="only">Spanish Only</option>
            </select>
          </div>

          <div class="option-group" id="columnGapGroup" style="display: none">
            <label for="columnGap"
              >Column Gap: <span id="gapValue">10%</span></label
            >
            <input
              type="range"
              id="columnGap"
              min="5"
              max="30"
              value="10"
              style="width: 100%; padding: 0; cursor: pointer"
            />
          </div>
        </div>

        <!-- Colors -->
        <div class="config-section">
          <h3>🎨 Colors</h3>
          <div class="option-group">
            <label>English Text Color</label>
            <div class="color-picker-group">
              <input type="color" id="enColor" value="#000000" />
              <input type="text" id="enColorText" value="#000000" />
            </div>
          </div>

          <div class="option-group">
            <label>Spanish Text Color</label>
            <div class="color-picker-group">
              <input type="color" id="esColor" value="#666666" />
              <input type="text" id="esColorText" value="#666666" />
            </div>
          </div>
        </div>

        <!-- Style Mode -->
        <div class="config-section">
          <h3>💅 Style Mode</h3>
          <div class="option-group">
            <label for="styleMode">CSS Application</label>
            <select id="styleMode">
              <option value="class">CSS Classes (Default)</option>
              <option value="inline">Inline Styles</option>
              <option value="hybrid">Hybrid (Both)</option>
            </select>
          </div>
        </div>

        <!-- Advanced Features (Phase 4) -->
        <div class="config-section">
          <h3>🔧 Advanced Features</h3>

          <div class="option-group">
            <label
              style="
                display: flex;
                align-items: center;
                gap: 8px;
                cursor: pointer;
              "
            >
              <input
                type="checkbox"
                id="elementTypeFormatting"
                style="width: auto; cursor: pointer"
              />
              <span>Smart Element Formatting</span>
            </label>
            <p style="font-size: 12px; color: #6b7280; margin: 4px 0 0 24px">
              Inline text stays inline, lists/tables stack vertically
            </p>
          </div>

          <div class="option-group">
            <label
              style="
                display: flex;
                align-items: center;
                gap: 8px;
                cursor: pointer;
              "
            >
              <input
                type="checkbox"
                id="preserveLineBreaks"
                style="width: auto; cursor: pointer"
              />
              <span>Poetry/Code Mode</span>
            </label>
            <p style="font-size: 12px; color: #6b7280; margin: 4px 0 0 24px">
              Align line-by-line for formatted content
            </p>
          </div>

          <div class="option-group">
            <label
              style="
                display: flex;
                align-items: center;
                gap: 8px;
                cursor: pointer;
              "
            >
              <input
                type="checkbox"
                id="usePlaceholder"
                checked
                style="width: auto; cursor: pointer"
              />
              <span>Protect Complex Elements</span>
            </label>
            <p style="font-size: 12px; color: #6b7280; margin: 4px 0 0 24px">
              Preserve SVG, Math, Code blocks during alignment
            </p>
          </div>
        </div>

        <div class="actions">
          <button class="action-btn btn-secondary" id="cancelBtn">Back</button>
          <button class="action-btn btn-primary" id="saveBtn">
            Save Changes
          </button>
        </div>
      </div>
    </div>

    <script>
      let bilingualConfig = {
        layoutMode: "below",
        columnGap: 10,
        enColor: "#000000",
        esColor: "#666666",
        styleMode: "class",
        // Phase 4 Advanced Features
        elementTypeFormatting: false,
        preserveLineBreaks: false,
        usePlaceholder: true,
      };

      const PRESETS = {
        default: {
          layoutMode: "below",
          columnGap: 10,
          enColor: "#000000",
          esColor: "#666666",
          styleMode: "class",
        },
        side_by_side: {
          layoutMode: "side",
          columnGap: 10,
          enColor: "#000000",
          esColor: "#000000",
          styleMode: "class",
        },
        color_coded: {
          layoutMode: "below",
          columnGap: 10,
          enColor: "#000000",
          esColor: "#555555",
          styleMode: "inline",
        },
        learner_mode: {
          layoutMode: "side",
          columnGap: 15,
          enColor: "#000000",
          esColor: "#0066cc",
          styleMode: "inline",
        },
      };

      function initConfig() {
        const saved = localStorage.getItem("epubConfig");
        if (saved) bilingualConfig = JSON.parse(saved);

        updateConfigForm();
        updatePreview();

        // Attach listeners
        document.getElementById("saveBtn").addEventListener("click", () => {
          saveConfigFromForm();
          window.location.href = "/"; // Go back to main page
        });

        document.getElementById("cancelBtn").addEventListener("click", () => {
          window.location.href = "/"; // Just go back
        });

        // Live inputs
        document.querySelectorAll(".preset-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const p = PRESETS[btn.dataset.preset];
            if (p) {
              bilingualConfig = { ...p };
              updateConfigForm();
            }
          });
        });

        document
          .getElementById("layoutMode")
          .addEventListener("change", (e) => {
            document.getElementById("columnGapGroup").style.display =
              e.target.value === "side" ? "block" : "none";
          });

        ["enColor", "esColor"].forEach((id) => {
          document.getElementById(id).addEventListener("input", (e) => {
            document.getElementById(id + "Text").value = e.target.value;
          });
          document
            .getElementById(id + "Text")
            .addEventListener("input", (e) => {
              document.getElementById(id).value = e.target.value;
            });
        });

        document.getElementById("columnGap").addEventListener("input", (e) => {
          document.getElementById("gapValue").innerText = e.target.value + "%";
        });
      }

      function updateConfigForm() {
        document.getElementById("layoutMode").value =
          bilingualConfig.layoutMode;
        document.getElementById("columnGap").value = bilingualConfig.columnGap;
        document.getElementById("gapValue").innerText =
          bilingualConfig.columnGap + "%";
        document.getElementById("columnGapGroup").style.display =
          bilingualConfig.layoutMode === "side" ? "block" : "none";

        document.getElementById("enColor").value = bilingualConfig.enColor;
        document.getElementById("enColorText").value = bilingualConfig.enColor;
        document.getElementById("esColor").value = bilingualConfig.esColor;
        document.getElementById("esColorText").value = bilingualConfig.esColor;

        document.getElementById("styleMode").value = bilingualConfig.styleMode;

        // Phase 4 Advanced Features
        document.getElementById("elementTypeFormatting").checked =
          bilingualConfig.elementTypeFormatting || false;
        document.getElementById("preserveLineBreaks").checked =
          bilingualConfig.preserveLineBreaks || false;
        document.getElementById("usePlaceholder").checked =
          bilingualConfig.usePlaceholder !== undefined
            ? bilingualConfig.usePlaceholder
            : true;

        // Update active preset
        document
          .querySelectorAll(".preset-btn")
          .forEach((btn) => btn.classList.remove("active"));
        updatePreview();
      }

      function saveConfigFromForm() {
        bilingualConfig.layoutMode =
          document.getElementById("layoutMode").value;
        bilingualConfig.columnGap = parseInt(
          document.getElementById("columnGap").value
        );
        bilingualConfig.enColor = document.getElementById("enColor").value;
        bilingualConfig.esColor = document.getElementById("esColor").value;
        bilingualConfig.styleMode = document.getElementById("styleMode").value;

        // Phase 4 Advanced Features
        bilingualConfig.elementTypeFormatting = document.getElementById(
          "elementTypeFormatting"
        ).checked;
        bilingualConfig.preserveLineBreaks =
          document.getElementById("preserveLineBreaks").checked;
        bilingualConfig.usePlaceholder =
          document.getElementById("usePlaceholder").checked;

        localStorage.setItem("epubConfig", JSON.stringify(bilingualConfig));
      }

      function updatePreview() {
        const prev = document.getElementById("settingsPreview");
        if (prev) {
          prev.innerHTML = `
                  <span class="setting-tag">📐 ${bilingualConfig.layoutMode}</span>
                  <span class="setting-tag"><span style="color:${bilingualConfig.enColor}">●</span> EN</span>
                  <span class="setting-tag"><span style="color:${bilingualConfig.esColor}">●</span> ES</span>
              `;
        }
      }

      window.addEventListener("load", initConfig);
    </script>
  </body>
</html>
