<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bilingual Ebook Aligner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #6366f1;
        --primary-hover: #4f46e5;
        --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
        --card-bg: rgba(255, 255, 255, 0.95);
        --text-main: #1f2937;
        --text-sub: #6b7280;
        --border: #e5e7eb;
        --success: #10b981;
      }
      body {
        font-family: "Outfit", sans-serif;
        background: var(--bg-gradient);
        color: var(--text-main);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .container {
        background: var(--card-bg);
        padding: 3rem;
        border-radius: 1.5rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        width: 100%;
        max-width: 550px;
        text-align: center;
        backdrop-filter: blur(10px);
        transform: translateY(0);
        transition: transform 0.3s ease;
      }
      .container:hover {
        transform: translateY(-5px);
      }
      h1 {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        background: linear-gradient(to right, #4f46e5, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p.subtitle {
        color: var(--text-sub);
        margin-bottom: 2.5rem;
      }
      .upload-area {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }
      .file-input-wrapper {
        position: relative;
        border: 2px dashed var(--border);
        border-radius: 1rem;
        padding: 2rem;
        transition: all 0.3s ease;
        cursor: pointer;
        background: #f9fafb;
      }
      .file-input-wrapper:hover {
        border-color: var(--primary);
        background-color: #eef2ff;
        transform: scale(1.02);
      }
      .file-input-wrapper input[type="file"] {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        cursor: pointer;
      }
      .icon {
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
        display: block;
      }
      .label-text {
        font-weight: 600;
        display: block;
        margin-bottom: 0.25rem;
        color: #374151;
      }
      .file-name {
        font-size: 0.875rem;
        color: var(--primary);
        display: block;
        min-height: 1.25em;
        font-weight: 500;
      }
      button.submit-btn {
        background: linear-gradient(to right, var(--primary), #818cf8);
        color: white;
        border: none;
        padding: 1rem 2rem;
        border-radius: 0.75rem;
        font-weight: 600;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.3s;
        width: 100%;
        margin-top: 2rem;
        box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
      }
      button.submit-btn:hover {
        filter: brightness(1.1);
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
      }
      button.submit-btn:disabled {
        background: var(--text-sub);
        cursor: not-allowed;
        transform: none;
      }

      /* Progress Bar Styles */
      .progress-wrapper {
        margin-top: 2rem;
      }
      .progress-container {
        width: 100%;
        background-color: #e5e7eb;
        border-radius: 9999px;
        overflow: hidden;
        height: 0.75rem;
      }
      .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, var(--primary), #ec4899);
        width: 0%;
        transition: width 0.3s ease;
        border-radius: 9999px;
      }
      .status-text {
        margin-top: 0.75rem;
        font-size: 0.95rem;
        color: var(--text-sub);
        font-weight: 500;
        min-height: 1.5em;
      }
      .error-message {
        color: #ef4444;
        margin-top: 1rem;
        font-size: 0.9rem;
        font-weight: 500;
        display: none;
        padding: 0.75rem;
        background: #fef2f2;
        border-radius: 0.5rem;
        border: 1px solid #fee2e2;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Bilingual Ebook Aligner</h1>
      <p class="subtitle">Create perfectly aligned bilingual books with AI</p>

      <form id="uploadForm">
        <div class="upload-area">
          <div class="file-input-wrapper" id="drop-zone-en">
            <span class="icon">🇬🇧</span>
            <span class="label-text">Original (English) EPUB</span>
            <span class="file-name" id="filename-en">Click to upload</span>
            <input
              type="file"
              name="en_file"
              id="en_file"
              accept=".epub"
              required
              onchange="updateFilename(this, 'filename-en')"
            />
          </div>

          <div class="file-input-wrapper" id="drop-zone-es">
            <span class="icon">🇪🇸</span>
            <span class="label-text">Translation (Spanish) EPUB</span>
            <span class="file-name" id="filename-es">Click to upload</span>
            <input
              type="file"
              name="es_file"
              id="es_file"
              accept=".epub"
              required
              onchange="updateFilename(this, 'filename-es')"
            />
          </div>
        </div>

        <button type="submit" class="submit-btn" id="generateBtn">
          Generate Bilingual Book
        </button>

        <div class="error-message" id="errorMessage"></div>

        <div
          class="progress-wrapper"
          id="progressWrapper"
          style="display: none"
        >
          <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
          </div>
          <div class="status-text" id="statusText">Starting...</div>
        </div>
      </form>
    </div>

    <script>
      function updateFilename(input, targetId) {
        const fileName = input.files[0]
          ? input.files[0].name
          : "Click to upload";
        document.getElementById(targetId).innerText = fileName;
      }

      document
        .getElementById("uploadForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const btn = document.getElementById("generateBtn");
          const progressWrapper = document.getElementById("progressWrapper");
          const progressBar = document.getElementById("progressBar");
          const statusText = document.getElementById("statusText");
          const errorMessage = document.getElementById("errorMessage");

          // Reset UI
          errorMessage.style.display = "none";
          btn.disabled = true;
          progressWrapper.style.display = "block";
          progressBar.style.width = "0%";
          statusText.innerText = "Uploading files...";

          const formData = new FormData(this);

          try {
            // 1. Upload
            const response = await fetch("/upload", {
              method: "POST",
              body: formData,
            });

            if (!response.ok) {
              throw new Error("Upload failed");
            }

            const data = await response.json();
            const jobId = data.job_id;

            // 2. Poll for Status
            pollStatus(jobId);
          } catch (err) {
            showError("Error: " + err.message);
            btn.disabled = false;
          }
        });

      async function pollStatus(jobId) {
        const progressBar = document.getElementById("progressBar");
        const statusText = document.getElementById("statusText");
        const btn = document.getElementById("generateBtn");

        const interval = setInterval(async () => {
          try {
            const res = await fetch(`/progress/${jobId}`);
            if (!res.ok) throw new Error("Status check failed");

            const job = await res.json();

            if (job.status === "processing" || job.status === "queued") {
              progressBar.style.width = job.progress + "%";
              statusText.innerText = job.message;
            } else if (job.status === "completed") {
              clearInterval(interval);
              progressBar.style.width = "100%";
              statusText.innerText = "Done! Downloading...";

              // Slight delay for UX
              setTimeout(() => {
                window.location.href = `/download/${jobId}`;
                btn.disabled = false;
                statusText.innerText = "Generation Complete!";
              }, 500);
            } else if (job.status === "error") {
              clearInterval(interval);
              showError("Processing Failed: " + job.message);
              btn.disabled = false;
            }
          } catch (err) {
            // Don't stop polling immediately on one network blip, but here we keep it simple
            console.error(err);
            // clearInterval(interval);
            // showError("Network Error polling status");
            // btn.disabled = false;
          }
        }, 1000);
      }

      function showError(msg) {
        const el = document.getElementById("errorMessage");
        el.innerText = msg;
        el.style.display = "block";
      }
    </script>
  </body>
</html>
